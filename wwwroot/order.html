<!DOCTYPE html>
<html lang="sk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pridať Objednávku</title>
    <link rel="stylesheet" href="css/orders.css">
</head>
<body>
    <header>
        <div class="header-content">
            <img src="assets/Logo.png" alt="Logo našej spoločnosti, ktorá dodáva komponenty pre barberov" />
        </div>
        <nav>
            <ul>
                <li><a href="index.html">Domov</a></li>
                <li><a href="#" id="cart">Košík (<span id="cart-count">0</span>)</a></li>
            </ul>
        </nav>
    </header>

    <h1>Pridať Objednávku</h1>

    

    <h1>Sposob Dopravy</h1>
    <div id="product-list" class="product-list"></div>

    <form id="orderForm">
        <!-- Sekcia pre meno zákazníka -->
        <div class="form-group">
            <label for="customerName">Meno zákazníka:</label>
            <input type="text" id="customerName" name="customerName" required>
        </div>

        <!-- Sekcia pre email zákazníka -->
        <div class="form-group">
            <label for="customerEmail">Email zákazníka:</label>
            <input type="email" id="customerEmail" name="customerEmail" required>
        </div>

        <div class="form-group">
            <label for="customerPhone">Tel. číslo zákazníka:</label>
            <input type="text" id="customerPhone" name="customerPhone" required>
        </div>

        <!-- Sekcia pre adresu zákazníka -->
        <div class="form-group">
            <h3>Adresa zákazníka</h3>
            <label for="street">Ulica:</label>
            <input type="text" id="street" name="street" required>
            
            <label for="city">Mesto:</label>
            <input type="text" id="city" name="city" required>
            
            <label for="postalCode">PSČ:</label>
            <input type="text" id="postalCode" name="postalCode" required>
            
            <label for="country">Krajina:</label>
            <input type="text" id="country" name="country" required>
        </div>

        <div class="form-group">
            <label for="kurier">Vyberte kuriéra:</label>
            <select id="kurier" name="kurier" required>
                <option value="Slovak Parcel Service">Slovak Parcel Service</option>
                <option value="Slovenská pošta">Slovenská pošta</option>
            </select>
        </div>

        <!-- Tlačidlo pre odoslanie objednávky -->
        <button type="submit">Odoslať objednávku</button>
       
    </form>

    <script src="js/orders.js"></script>
   
    
</body>
</html>
