<!DOCTYPE html>
<html lang="sk">
<head>
    <meta charset="UTF-8">
    <title>Prihlásenie</title>
    <link rel="stylesheet" type="text/css" href="css/prihlasenie.css"> 
<body>
    <header>
        <div class="logo">
            <img src="assets/Logo.png" alt="Logo našej spoločnosti">
        </div>
        <nav>
            <ul class="menu">
                <li><a href="index.html">Domov</a></li>
                <li><a href="about.html">O nás</a></li>
                <li><a href="produkty.html">Obchod</a></li>
                <li><a href="wishlist.html">Wishlist</a></li>
                <li><a href="contact.html">Kontakt</a></li>
                <li><a href="#" id="cart">Košík (<span id="cart-count">0</span>)</a></li>
            </ul>
        </nav>
    </header>

    <div>
        <h2>Prihlásenie</h2> <!-- Nadpis -->
        <form action="/account/login" method="post">
            <label for="username">Meno:</label>
            <input type="text" id="username" name="username" required />
            <br>
            <label for="password">Heslo:</label>
            <input type="password" id="password" name="password" required />
            <br>
            <button type="submit">Prihlásiť sa</button>
        </form>
        <script>
            // Kontrola pre chybovú hlášku
            const urlParams = new URLSearchParams(window.location.search);
            if (urlParams.has('error')) {
                document.write('<p style="color:red;">Nesprávne meno alebo heslo</p>');
            }
        </script>
    </div>
</body>
</html>
