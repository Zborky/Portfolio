<!DOCTYPE html>
<html lang="sk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registrácia</title>
    <link rel="stylesheet" href="css/register.css"> 
</head>
<body>

    <header>
        <div class="logo">
            <img src="assets/Logo.png" alt="Logo našej spoločnosti">
        </div>
        <nav>
            <ul class="menu">
                <li><a href="index.html">Domov</a></li>
                <li><a href="about.html">O nás</a></li>
                <li><a href="produkty.html">Obchod</a></li>
                <li><a href="wishlist.html">Wishlist</a></li>
                <li><a href="contact.html">Kontakt</a></li>
                <li><a href="#" id="cart">Košík (<span id="cart-count">0</span>)</a></li>
            </ul>
        </nav>
    </header>

    <div class="container">
        <h2>Registrácia</h2>
        
        <!-- Registrácia formulár -->
        <form action="/account/register" method="post">
            <div class="form-group">
                <label for="username">Meno:</label>
                <input type="text" id="username" name="username" required placeholder="Zadajte vaše meno">
            </div>
            
            <div class="form-group">
                <label for="email">Email:</label>
                <input type="email" id="email" name="email" required placeholder="Zadajte váš email">
            </div>
            
            <div class="form-group">
                <label for="password">Heslo:</label>
                <input type="password" id="password" name="password" required placeholder="Zadajte vaše heslo">
            </div>

            <div class="form-group">
                <label for="confirmPassword">Potvrďte heslo:</label>
                <input type="password" id="confirmPassword" name="confirmPassword" required placeholder="Potvrďte vaše heslo">
            </div>

            <!-- Výber role -->
            <div class="form-group">
                <label for="role">Rola:</label>
                <select id="role" name="role" required>
                    <option value="User">Používateľ</option>
                    <option value="Admin">Administrátor</option>
                </select>
            </div>

            <button type="submit" class="btn">Zaregistrovať sa</button>
        </form>

        <!-- Odkaz na prihlásenie, ak už má používateľ účet -->
        <p>Máte už účet? <a href="/login.html">Prihláste sa tu</a>.</p>
    </div>

</body>
</html>
