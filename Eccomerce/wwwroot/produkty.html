<html lang="sk">

    <meta charset="UTF-8">

   <link rel="stylesheet" href="css/produktFinal.css">

<body>
    <header>
        <div class="logo">
            <img src="assets/Logo.png" alt="Logo našej spoločnosti">

        <nav>

    <main>
        <h1>Naše Produkty</h1>
        <div class="sort-buttons">

        </div>
        <div id="product-list" class="product-list"></div>

        <ul id="cart-items">
            <!-- Dynamicky generované položky -->
        </ul>
        <div class="cart-footer">
            <button id="continue-to-order" class="btn order-btn">Pokračovať k objednávke</button>
