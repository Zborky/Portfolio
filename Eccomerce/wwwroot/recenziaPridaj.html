<!DOCTYPE html>
<html lang="sk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pridaj Recenziu</title>
    <link rel="stylesheet" href="css/admin1.css">
    <link rel="icon" href="assets/Logo.png" type="image/png">
</head>
<body>
    <header>
        <div class="header-content">
            <img src="assets/Logo.png" alt="Logo spoločnosti" />
        </div>

        <nav>
            <ul>
                <li><a href="index.html">Späť na hlavnú stránku</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <h1>Pridávanie Recenzií</h1>

        <!-- Formulár na recenziu -->
        <form id="reviewForm">
            <label for="reviewName">Meno zákazníka:</label>
            <input type="text" id="reviewName" name="name" required>

            <label for="reviewEmail">Email zákazníka:</label>
            <input type="email" id="reviewEmail" name="email" required>

            <label for="reviewProduct">Názov produktu:</label>
            <input type="text" id="reviewProduct" name="product" required>

            <label for="reviewText">Recenzia:</label>
            <textarea id="reviewText" name="text" required></textarea>

            <label for="reviewRating">Hodnotenie (1-5):</label>
            <input type="number" id="reviewRating" name="rating" min="1" max="5" required>

            <button type="submit">Odoslať recenziu</button>
        </form>

        
        
    </main>

    <script src="js/Review.js"></script>
</body>
</html>
